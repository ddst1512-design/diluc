name: Build Diluc Armor

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the mod
        run: bash ./gradlew build --no-daemon --stacktrace

      - name: Save mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Diluc-Armor-JAR
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
